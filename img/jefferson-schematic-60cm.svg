<svg class="base-diagram" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 870" width="1240" height="1740" aria-labelledby="title desc"><title id="title">Jefferson outdoor base: elevation and plan</title><desc id="desc">100 cm sculpture on a 120 cm high, 60 cm diameter cylindrical base. The base is cast 130 cm high; its top 10 cm fits into a recess in the sculpture. Overall height approximately 220 cm. A 165 cm person indicates scale. Foundation size and depth require engineering design.</desc><defs><pattern id="hatch" patternUnits="userSpaceOnUse" width="9" height="9" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="9" stroke="#9b8c70" stroke-width="2" opacity=".35"/></pattern></defs><style>.base-diagram .txt{font:16px Georgia,serif;fill:#453c2c}.base-diagram .label{font:12px Arial,sans-serif;letter-spacing:2px;fill:#79541e}.base-diagram .measure{font:16px Georgia,serif;fill:#79541e}.base-diagram .note{font:13px Arial,sans-serif;fill:#655943}.base-diagram .dim{stroke:#9a783f;stroke-width:1;fill:none}.base-diagram .guide{stroke:#9a783f;stroke-width:.8;stroke-dasharray:3 4;opacity:.7}.base-diagram .outline{stroke:#514938;stroke-width:1.4;fill:none}</style><rect width="620" height="870" fill="#e1d4b7"/>
